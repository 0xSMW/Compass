# XcodeGen spec. Generate with `xcodegen generate` (CI does this; the .xcodeproj is not committed).
name: Compass
options:
  bundleIdPrefix: app.compass
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  CompassCore:
    path: Packages/CompassCore

targets:
  Compass:
    type: application
    platform: iOS
    sources:
      - path: Compass
      - path: Shared
    dependencies:
      - package: CompassCore
      - target: CompassWidget
    entitlements:
      path: Compass/Compass.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.compass.shared
    info:
      path: Compass/Info.plist
      properties:
        CFBundleDisplayName: Compass
        UILaunchScreen:
          UIColorName: Ground
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - InterTight-Regular.ttf
          - InterTight-Medium.ttf
          - InterTight-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
        NSMicrophoneUsageDescription: Compass records your voice for your goal, notes and reflections. Audio stays on this iPhone.
        NSSpeechRecognitionUsageDescription: Speech becomes text on this iPhone.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.compass.Compass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CompassWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CompassWidget
      - path: Shared
      - path: Compass/DesignSystem/Tokens
      - path: Compass/DesignSystem/Icons.xcassets
      - path: Compass/Resources/Fonts
    dependencies:
      - package: CompassCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    entitlements:
      path: CompassWidget/CompassWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.compass.shared
    info:
      path: CompassWidget/Info.plist
      properties:
        CFBundleDisplayName: Compass
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - InterTight-Regular.ttf
          - InterTight-Medium.ttf
          - InterTight-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.compass.Compass.Widget
        SKIP_INSTALL: YES

  CompassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CompassUITests
    dependencies:
      - target: Compass
      - package: CompassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.compass.CompassUITests
        TEST_TARGET_NAME: Compass

schemes:
  Compass:
    build:
      targets:
        Compass: all
        CompassWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CompassUITests
      gatherCoverageData: false
