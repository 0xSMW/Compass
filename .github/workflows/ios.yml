name: iOS

on:
  push:
    branches: [main, claude/friendly-ritchie-5q2nh9]
  pull_request:
  workflow_dispatch:
    inputs:
      screens:
        description: "Comma-separated ScreenIDs to capture (empty = all 66)"
        required: false
        default: ""

# No concurrency group: several agents push in parallel and each needs its own
# run to finish. Screenshot commits rebase before pushing; README.txt names the
# commit that produced the current PNGs. Only pushes to the screenshot branch
# commit PNGs back; pull requests and main build and test without writing.

permissions:
  contents: write

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  SCREENSHOT_BRANCH: claude/friendly-ritchie-5q2nh9

jobs:
  core:
    name: CompassCore (Linux, swift test)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/CompassCore
        run: swift test

  app:
    name: App + widget build, UI screenshots (macOS 26, Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator (390x844 pt preferred)
        id: sim
        run: |
          set -euo pipefail
          # iPhone 16e (390x844 pt) ships with the iOS 26.2 runtime on this image; 17e is the fallback.
          UDID=""
          for NAME in "iPhone 16e" "iPhone 17e" "iPhone 17"; do
            UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          name=sys.argv[1]
          d=json.load(sys.stdin)['devices']
          c=[(rt,x['udid']) for rt,l in d.items() if 'iOS' in rt for x in l if x['name']==name]
          c.sort(reverse=True)
          print(c[0][1] if c else '')" "$NAME")
            if [ -n "$UDID" ]; then echo "Using $NAME ($UDID)"; echo "name=$NAME" >> "$GITHUB_OUTPUT"; break; fi
          done
          if [ -z "$UDID" ]; then echo "No simulator found"; xcrun simctl list devices available; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          xcrun simctl ui "$UDID" appearance dark || true

      - name: Build app, widget and UI tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project Compass.xcodeproj -scheme Compass \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/build.log | grep -E "error:|warning: .*deprecated|BUILD|\*\*" || true
          grep -q "TEST BUILD SUCCEEDED" build/build.log || { grep -E "error:" -A3 build/build.log | head -200; exit 1; }

      - name: Check privacy manifest and usage strings in the app bundle
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products -maxdepth 2 -name Compass.app | head -1)
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "PrivacyInfo.xcprivacy missing from $APP"; exit 1; }
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          if /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Info.plist" | grep -q "stays on this iPhone"; then
            echo "Microphone usage string claims audio stays on the phone, but recordings sync to iCloud"; exit 1
          fi

      - name: Run app unit tests (CompassTests)
        id: unit
        run: |
          set +e
          xcodebuild test-without-building \
            -project Compass.xcodeproj -scheme Compass \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/UnitTests.xcresult \
            -only-testing:CompassTests \
            > build/unit.log 2>&1
          STATUS=$?
          grep -E "Test Case|error:|failed|passed|Executed|TEST" build/unit.log | tail -80
          if ! grep -q "Executed [1-9]" build/unit.log; then echo "No unit tests ran"; STATUS=1; fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Run screenshot tests
        id: tests
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/build/screens-raw
          TEST_RUNNER_SCREENS: ${{ github.event.inputs.screens }}
        run: |
          set +e
          mkdir -p build/screens-raw
          xcodebuild test-without-building \
            -project Compass.xcodeproj -scheme Compass \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Screenshots.xcresult \
            -only-testing:CompassUITests \
            > build/test.log 2>&1
          STATUS=$?
          grep -E "Test Case|error:|failed|passed|TEST" build/test.log | tail -80
          COUNT=$(ls build/screens-raw | wc -l | tr -d ' ')
          echo "Screenshots: $COUNT"
          if [ -z "${TEST_RUNNER_SCREENS}" ] && [ "$COUNT" -lt 66 ] && [ "$STATUS" = "0" ]; then echo "Expected 66 screenshots"; STATUS=1; fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Normalise screenshots to 390x844 and commit
        if: always() && steps.sim.outcome == 'success' && github.event_name == 'push' && github.ref_name == env.SCREENSHOT_BRANCH
        run: |
          set -euo pipefail
          mkdir -p renders/ios
          shopt -s nullglob
          PNGS=(build/screens-raw/*.png)
          if [ ${#PNGS[@]} -eq 0 ]; then echo "No screenshots produced"; exit 0; fi
          for f in "${PNGS[@]}"; do
            sips -z 844 390 "$f" --out "renders/ios/$(basename "$f")" > /dev/null
          done
          echo "Simulator: ${{ steps.sim.outputs.name }}" > renders/ios/README.txt
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> renders/ios/README.txt
          echo "Commit: ${{ github.sha }}" >> renders/ios/README.txt
          ls renders/ios | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=50 origin "${GITHUB_REF_NAME}"
          latest=$(git log "origin/${GITHUB_REF_NAME}" --format=%H --invert-grep --grep='\[skip ci\]' -1)
          if [ "$latest" != "${GITHUB_SHA}" ]; then echo "Newer code ($latest) is on the branch; its run publishes screenshots"; exit 0; fi
          git add renders/ios
          if git diff --cached --quiet; then echo "No screenshot changes"; exit 0; fi
          git commit -m "Update iOS screenshots from ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if tests failed
        if: always()
        run: |
          FAIL=0
          if [ "${{ steps.unit.outputs.status }}" != "0" ]; then
            echo "Unit tests failed"; grep -E "error:|failed" build/unit.log | head -60 || true; FAIL=1
          fi
          if [ "${{ steps.tests.outputs.status }}" != "0" ]; then
            echo "Screenshot tests failed"; grep -E "error:|failed" build/test.log | head -60 || true; FAIL=1
          fi
          exit $FAIL
